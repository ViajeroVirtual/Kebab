services:
  - type: web
    name: algekebab
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Opción Supabase:
      # - key: SUPABASE_URL
      #   value: https://tu-proyecto.supabase.co
      # - key: SUPABASE_KEY
      #   value: tu-anon-key
      # Opción PostgreSQL directa:
      # - key: DATABASE_URL
      #   value: postgres://...
